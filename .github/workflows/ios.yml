name: iOS

on:
  pull_request:
    branches: [main]
    paths:
      - "mobile/**"
      - "src/**"
      - ".github/workflows/ios.yml"
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "src/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:
    inputs:
      signed_archive:
        description: "Apple 자동 서명으로 App Store용 archive 생성"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator-build:
    name: iOS simulator build
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci --prefix mobile

      - name: Prepare CI web shell and Capacitor project
        run: npm --prefix mobile run ci:prepare

      - name: Verify generated mobile project
        run: npm --prefix mobile run verify

      - name: Build without code signing
        run: >-
          xcodebuild
          -project mobile/ios/App/App.xcodeproj
          -scheme App
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/GachiDerivedData"
          CODE_SIGNING_ALLOWED=NO
          clean build

  signed-archive:
    name: Signed App Store archive
    if: github.event_name == 'workflow_dispatch' && inputs.signed_archive
    runs-on: macos-15
    timeout-minutes: 45
    environment: app-store
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_BUNDLE_ID: com.wizide.gachi
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci --prefix mobile

      - name: Prepare CI web shell and Capacitor project
        run: npm --prefix mobile run ci:prepare

      - name: Validate signing secrets
        env:
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: |
          test -n "$APPLE_TEAM_ID"
          test -n "$ASC_KEY_ID"
          test -n "$ASC_ISSUER_ID"
          test -n "$ASC_PRIVATE_KEY_BASE64"
          echo "$ASC_PRIVATE_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"

      - name: Apply and verify Apple project identity
        run: |
          npm --prefix mobile run apple:configure
          node mobile/scripts/verify-apple.mjs --require-team

      - name: Create signed archive
        run: >-
          xcodebuild
          -project mobile/ios/App/App.xcodeproj
          -scheme App
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath "$RUNNER_TEMP/GACHI.xcarchive"
          -allowProvisioningUpdates
          -authenticationKeyPath "$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          -authenticationKeyID "$ASC_KEY_ID"
          -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          DEVELOPMENT_TEAM="$APPLE_TEAM_ID"
          PRODUCT_BUNDLE_IDENTIFIER="$APPLE_BUNDLE_ID"
          clean archive

      - name: Upload archive artifact
        uses: actions/upload-artifact@v7
        with:
          name: GACHI-xcarchive
          path: ${{ runner.temp }}/GACHI.xcarchive
          retention-days: 7
